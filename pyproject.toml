[project]
name = "evaltrials"
version = "0.1.0"
description = "Agent-first catalog and fetcher for public AI-evaluation trial data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Evan Kim" }]
dependencies = [
  "pyyaml>=6.0",
  "pyarrow>=15",
  "duckdb>=1.0",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.25"]
dev = ["pytest>=8.0"]

[project.scripts]
evaltrials = "evaltrials.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
