- id: epoch-benchmarking-hub
  title: Epoch AI Benchmarking Hub
  kind: llm-scores
  unit: cell
  multi_trial: 'yes'
  trajectories: none
  upstream:
    url: https://epoch.ai/benchmarks
    homepage: https://epoch.ai/benchmarks/use-this-data
  license:
    spdx: cc-by-4.0
    redistributable: true
  gate: open
  scale:
    rows: 1103
    benchmarks: 37
    models: 126
    trials_per_cell: 16 on GPQA Diamond and Mock AIME, 8 on MATH L5
    rows_note: score rows behind the ECI fit, per Epoch's own page.
  bytes: null
  verified:
    rows: not-on-hf
    bytes: not-checked
    checked: '2026-09-14'
  runs:
    first: '2023'
    last: 2026-09
    basis: reported
    note: the hub is continuously updated; CSV regenerated 2026-09-14.
  cost:
    usd: null
    basis: null
    note: not published as a total, though Epoch reports per-benchmark inference costs in places
  updated: '2026-09-14'
  notes:
  - 'The deepest repeat count of any open source: 16 runs per cell. Best available reference for what
    eval variance actually looks like.'
  - Epoch's own run tables are CC-BY and redistributable with credit. The underlying benchmark questions
    are not Epoch's to relicense.
  - Per-question Inspect logs exist behind a CAPTCHA-gated viewer, not as a bulk download.
  - LLM benchmarks, not agent trajectories. SWE-bench Verified here is score-level.
  announcement:
    url: https://epoch.ai/benchmarks/about
    date: '2025-10-10'
    publisher: Epoch AI
- id: swebench-experiments
  title: SWE-bench official submissions
  kind: llm-scores
  unit: cell
  multi_trial: 'no'
  trajectories: partial
  upstream:
    url: https://github.com/SWE-bench/experiments
    repo: SWE-bench/experiments
  license:
    spdx: mit
    redistributable: true
  gate: open
  scale:
    tasks: 2294
    trials_per_cell: 1 (pass@1 required; pass@k disallowed for the headline number)
    rows_note: one folder per submission; not row-counted.
  bytes: null
  verified:
    rows: not-on-hf
    bytes: not-checked
    checked: '2026-09-14'
  runs:
    first: 2023-10
    last: 2026-09
    basis: reported
    note: submissions accumulate continuously; each folder carries its own metadata.yaml date.
  cost:
    usd: null
    basis: null
    note: not published
  updated: '2026-09-01'
  notes:
  - LOOKS like a multi-trial corpus and is not. Different submissions are different systems, not i.i.d.
    repeats. Never read it as trial variance.
  - 'The field''s longest-running per-run archive: every official submission has carried trajectories
    since 2024.'
  - 'Per submission: all_preds.jsonl, metadata.yaml, evaluation logs, trajs/*.traj.'
  announcement:
    url: https://www.swebench.com/
    date: null
    publisher: SWE-bench team
