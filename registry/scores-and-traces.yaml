- id: eee-datastore
  title: Every Eval Ever (EvalEval datastore)
  kind: meta-index
  unit: collection
  multi_trial: 'no'
  trajectories: none
  upstream:
    url: https://huggingface.co/datasets/evaleval/EEE_datastore
    repo: evaleval/EEE_datastore
  license:
    spdx: mit
    redistributable: true
  gate: open
  scale:
    rows: 7300
    rows_note: CORRECTED. Measured 7,300 score rows across 32 benchmark configs. The widely-quoted 107
      is the number of eval COLLECTIONS, not rows.
  bytes: 3347393406
  verified:
    rows: datasets-server
    bytes: hf-api-2026-09-14
    checked: '2026-09-14'
  runs:
    first: null
    last: 2026-09
    basis: reported
    note: continuously updated aggregation, not a run campaign.
  cost:
    usd: null
    basis: null
    note: aggregation of published scores; no compute of its own
  updated: '2026-09-14'
  notes:
  - The largest existing consolidation effort - 107 eval collections normalized to one score schema.
  - Converts Inspect, HELM and lm-eval-harness output. Samples are optional; trial archives are out of
    scope.
  - Closest prior art to this index, but it consolidates SCORES, not runs.
  announcement:
    url: https://huggingface.co/blog/evaleval/eval-costs-bottleneck
    date: '2026-04-29'
    publisher: EvalEval / HuggingFace
