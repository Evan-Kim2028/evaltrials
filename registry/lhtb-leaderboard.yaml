id: lhtb-leaderboard
title: Long-Horizon Terminal-Bench leaderboard
status: implemented
unit: cell                       # per_task config has NO trial_id. one row = one (model, task).
upstream:
  kind: hf_dataset
  repo: IntelligenceLab/LHTB-leaderboard
  revision: 4232e5bc72b1
  paper: https://arxiv.org/abs/2607.08964
license: {spdx: apache-2.0, redistributable: true, attribution: "IntelligenceLab/LHTB-leaderboard"}
gate: open
verified_by: leaderboard-submission
scale: {rows: 1196, tasks: 46, models: 26}
trials_per_cell: {note: "aggregated away in per_task; raw trials live in submissions/"}
assets:
  - name: per_task
    default: true
    path: per_task config
    bytes: 200000                # ~KBs via datasets-server
    gives: [model, task_id, reward, solved, strict_pass, exception]
  - name: leaderboard
    path: leaderboard config
    bytes: 20000
    gives: [rank, model, agent, mean_reward, strict_pass_at_10, trials_per_task]
  - name: submissions
    path: submissions/**
    bytes: 51641148162           # 51.6 GB across 66805 files
    gives: [trajectory.json, recording.cast, reward.txt]
    note: "DANGER: a naive repo clone pulls 51.6 GB. single asciinema casts reach 9.8 GB."
fields:
  model:       {type: string, coverage: 1.0}
  task_id:     {type: string, coverage: 1.0}
  reward:      {type: float,  coverage: 1.0}
  solved:      {type: bool,   coverage: 1.0}
  strict_pass: {type: bool,   coverage: 1.0}
  exception:   {type: string, coverage: partial}
  trial_id:    {type: null,   coverage: 0.0, note: "UNIT IS CELL. do not compute trial variance from this."}
caveats:
  - "unit=cell. An agent that treats these rows as trials will report a variance that does not exist."
