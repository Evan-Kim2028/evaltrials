# Sources scoped but not yet implemented. `evaltrials catalog` lists them so an
# agent knows they exist and what it would cost to add them.
- id: harbor-parity
  title: Harbor adapter parity experiments
  status: planned
  unit: trial
  upstream: {kind: hf_dataset, repo: harborframework/parity-experiments, revision: 9e2aebde4195}
  license: {spdx: unset, redistributable: false, attribution: "harborframework/parity-experiments"}
  gate: unknown              # HF API returned 0 siblings; needs a token or is empty
  trials_per_cell: {note: "often 3"}
  value: "oracle/parity runs per adapter -> validity ground truth for the 54 harbor adapters"

- id: toolathlon-trajectories
  title: Toolathlon tool-use trajectories
  status: planned
  unit: trial
  upstream: {kind: hf_dataset, repo: hkust-nlp/Toolathlon-Trajectories, paper: https://arxiv.org/abs/2510.25726}
  license: {spdx: cc-by-4.0, redistributable: true, attribution: "hkust-nlp/Toolathlon-Trajectories"}
  gate: hf-gated             # requires accepting terms + HF token
  scale: {models: 17, tasks: 108}
  trials_per_cell: {value: 3}
  assets: [{name: trajectories, bytes: 2000000000}]

- id: malt-transcripts
  title: METR MALT public transcripts
  status: planned
  unit: trial
  upstream: {kind: hf_dataset, repo: metr-evals/malt-transcripts-public}
  license: {spdx: mit, redistributable: false, attribution: "METR MALT"}
  gate: hf-gated
  scale: {rows: 7179, tasks: 169, models: 19}
  trials_per_cell: {note: ">=5 under HCAST protocol"}
  assets: [{name: transcripts, bytes: 8480000000}]
  caveats: ["MIT but gated; METR withheld internal-task transcripts to limit contamination. Fetch with the user's own token; never mirror."]

- id: hal-traces
  title: Holistic Agent Leaderboard raw traces
  status: planned
  unit: trial
  upstream: {kind: hf_dataset, repo: agent-evals/hal_traces, homepage: https://hal.cs.princeton.edu/, paper: https://arxiv.org/abs/2510.11977}
  license: {spdx: unset, redistributable: false, attribution: "HAL (Princeton)"}
  gate: encrypted            # traces are encrypted ON PURPOSE to block scraping/training
  scale: {rollouts: 21730, benchmarks: 9, models: 9}
  assets: [{name: traces, bytes: 113000000000}]
  caveats: ["Decrypt on the user's machine via hal-decrypt, opt-in. evaltrials will never ship decrypted HAL bytes."]

- id: epoch-benchmarks
  title: Epoch AI Benchmarking Hub
  status: planned
  unit: cell
  upstream: {kind: http_csv, homepage: https://epoch.ai/benchmarks/use-this-data}
  license: {spdx: cc-by-4.0, redistributable: true, attribution: "Epoch AI, CC-BY 4.0"}
  gate: open
  trials_per_cell: {note: "16 on GPQA Diamond / Mock AIME, 8 on MATH L5"}
  value: "deepest k of any open source. reference variance for calibration."
  caveats: ["Epoch's own run tables are CC-BY. The underlying benchmark questions are not Epoch's to relicense."]

- id: swebench-experiments
  title: SWE-bench official submissions
  status: planned
  unit: cell                 # pass@1 required; pass@k DISALLOWED for the headline number
  upstream: {kind: github, repo: SWE-bench/experiments}
  license: {spdx: mit, redistributable: true, attribution: "SWE-bench/experiments"}
  gate: open
  caveats:
    - "NOT multi-trial. Different submissions are different systems, not i.i.d. repeats. Never treat as trial variance."
