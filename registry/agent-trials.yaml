# Datasets of AI-agent evaluation RUNS: one record per attempt at a task.
# These are the ones you can compute pass-rate variance from.

- id: harbor-adapter
  title: Harbor-Adapter
  kind: agent-trials
  unit: trial
  multi_trial: 'yes'
  trajectories: full
  upstream:
    url: https://huggingface.co/datasets/kendx/Harbor-Adapter
    repo: kendx/Harbor-Adapter
    paper: https://arxiv.org/abs/2609.04298
    homepage: https://harbor-index.org/
  license:
    spdx: other
    redistributable: false
  gate: open
  scale:
    rows: 178647
    rows_note: manifest config = 178,647 cells; the trajectories config holds 793,698 individual trials.
      Both measured.
    trials: 793698
    benchmarks: 60
    tasks: 7819
    agents: 6
    models: 16
    trials_per_cell: 1-5 (capped at the 5 most recent)
  bytes: 340000293953
  verified:
    rows: datasets-server
    bytes: hf-api-2026-09-14
    checked: '2026-09-14'
  runs:
    first: '2026-03-25'
    last: '2026-05-26'
    basis: measured
    note: measured from first_step_at across 783,135 extracted trials; 94% ran in April 2026. Dataset
      was not uploaded until 2026-07-11.
  cost:
    usd: 300000
    basis: reported
    note: harbor-index.org states the 54-benchmark sweep 'consumed 226B tokens and over $300K of compute'.
      Verified at the source 2026-09-14. This is the largest disclosed agent-eval spend anywhere.
    tokens_in: 226000000000
  updated: '2026-07-11'
  notes:
  - 'The broadest public multi-benchmark agent run dump: 60 benchmarks in one schema.'
  - Dataset card says license `other` and ships no license text. Fetch from upstream; do not mirror.
  - trials_per_cell is censored at 5, not sampled - do not treat it as a designed k.
  - Reward scale differs per benchmark. Never average reward across benchmarks.
  - The 16 MB manifest parquet is cell-level and carries no reward column; rewards live inside the 316
    GB of per-trial archives.
  announcement:
    url: https://harbor-index.org/
    date: '2026-07-07'
    publisher: Harbor / Harbor-Index
