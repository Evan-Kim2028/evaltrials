# Datasets of AI-agent evaluation RUNS: one record per attempt at a task.
# These are the ones you can compute pass-rate variance from.

- id: harbor-adapter
  title: Harbor-Adapter
  kind: agent-trials
  unit: trial
  multi_trial: "yes"
  trajectories: full
  upstream:
    url: https://huggingface.co/datasets/kendx/Harbor-Adapter
    repo: kendx/Harbor-Adapter
    paper: https://arxiv.org/abs/2609.04298
    homepage: https://harbor-index.org/
  license: {spdx: other, redistributable: false}
  gate: open
  scale:
    rows: 178647          # (benchmark, task, agent, model) cells
    trials: 793698        # measured from the extracted trial rows
    benchmarks: 60
    tasks: 7819
    agents: 6
    models: 16
    trials_per_cell: "1-5 (capped at the 5 most recent)"
  bytes: 340000293953
  cost: {usd: null, basis: null, note: "not published. 794k frontier-agent trials; the compute behind this is the largest single spend in the index."}
  updated: "2026-07-11"
  notes:
    - "The broadest public multi-benchmark agent run dump: 60 benchmarks in one schema."
    - "Dataset card says license `other` and ships no license text. Fetch from upstream; do not mirror."
    - "trials_per_cell is censored at 5, not sampled - do not treat it as a designed k."
    - "Reward scale differs per benchmark. Never average reward across benchmarks."
    - "The 16 MB manifest parquet is cell-level and carries no reward column; rewards live inside the 316 GB of per-trial archives."

- id: terminalbench-trajectories
  title: Terminal-Bench leaderboard trajectories
  kind: agent-trials
  unit: trial
  multi_trial: "yes"
  trajectories: full
  upstream:
    url: https://huggingface.co/datasets/yoonholee/terminalbench-trajectories
    repo: yoonholee/terminalbench-trajectories
    homepage: https://www.tbench.ai/
  license: {spdx: apache-2.0, redistributable: true}
  gate: open
  scale:
    rows: 52104
    benchmarks: 1
    tasks: 89
    agents: 26
    models: 49
    trials_per_cell: "~5 (TB requires 5 independent runs per submission)"
  bytes: 221003563
  cost:
    usd: 21563
    basis: measured
    note: "summed from the dataset's own cost_cents column, 2026-09-14. LOWER BOUND: 39.2% of trials report zero cost, and 237 rows carry a NEGATIVE cost (min -$15.99)."
    tokens_in: 32753686924
    tokens_out: 632468325
    agent_hours: 10251
  updated: "2026-03-09"
  notes:
    - "Best cost data in the index: per-trial USD, tokens and wall-clock on every row."
    - "26 scaffolds on the same 89 tasks - the widest scaffold axis available anywhere."
    - "Shares an identical task-name namespace with Harbor's terminal-bench adapter (89 tasks in both), so the two can be compared task-for-task."
    - "Scraped from a public leaderboard, not re-run. Self-reported. TB found cheating on the 2.0 board in April 2026 and now mandates trajectories."
    - "`steps` (the trajectory body) is present on 34,462 of 52,104 rows; token counts on the same 66.1%."

- id: hal-traces
  title: HAL (Holistic Agent Leaderboard) traces
  kind: agent-trials
  unit: trial
  multi_trial: "yes"
  trajectories: encrypted
  upstream:
    url: https://huggingface.co/datasets/agent-evals/hal_traces
    repo: agent-evals/hal_traces
    homepage: https://hal.cs.princeton.edu/
    paper: https://arxiv.org/abs/2510.11977
  license: {spdx: unset, redistributable: false}
  gate: encrypted
  scale: {rows: 21730, benchmarks: 9, models: 9, trials_per_cell: "varies by benchmark protocol"}
  bytes: 113000000000
  cost:
    usd: 40000
    basis: reported
    note: "the HAL paper reports ~$40k and 2.5B tokens for the flagship 21,730-rollout study."
    tokens_in: null
    tokens_out: null
  updated: "2026-02-01"
  notes:
    - "The clearest published cost-per-rollout in the field: ~$1.84 per rollout."
    - "Traces are encrypted ON PURPOSE to stop scraping and benchmark contamination. Decrypt locally via hal-decrypt; do not redistribute decrypted bytes."
    - "Covers AssistantBench, GAIA, Online Mind2Web, CORE-Bench, SciCode, ScienceAgentBench, SWE-bench Verified Mini, TAU-bench Airline, USACO."

